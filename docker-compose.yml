services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopsphere
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - shopsphere_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/shopsphere?useSSL=false&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: replace-this-with-a-long-random-secret-before-production-123456789
    ports:
      - "8080:8080"
volumes:
  shopsphere_mysql:
