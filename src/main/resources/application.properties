spring.application.name=shopsphere
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopsphere?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-before-production-123456}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
