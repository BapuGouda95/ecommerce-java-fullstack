spring.application.name=shopsphere
spring.datasource.url=jdbc:mysql://localhost:3306/shopsphere?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.jwt.secret=change-this-secret-to-a-long-random-value-before-production
app.jwt.expiration-seconds=86400
