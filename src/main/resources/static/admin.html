<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopSphere Admin</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body><header><a class="brand" href="/">ShopSphere <small>Admin</small></a><nav><a href="/">Store</a><button id="logout" class="ghost">Logout</button></nav></header><main class="admin"><div id="guard" class="panel">Checking administrator access...</div><section id="dashboard" class="hidden"><div class="section-head"><div><p class="eyebrow">CONTROL CENTER</p><h1>Admin dashboard</h1></div><button class="primary" onclick="openProduct()">Add product</button></div><div class="stats"><div class="panel"><span>Products</span><b id="productCount">0</b></div><div class="panel"><span>Orders</span><b id="orderCount">0</b></div><div class="panel"><span>Revenue</span><b id="revenue">₹0</b></div></div><div class="panel"><h2>Products</h2><div id="productsTable"></div></div><div class="panel"><h2>Orders</h2><div id="ordersTable"></div></div></section></main><div id="productModal" class="modal"><div class="modal-card"><button class="modal-close" onclick="closeProduct()">×</button><h2 id="productTitle">Add product</h2><form id="productForm"><input id="pName" placeholder="Product name" maxlength="120" required><input id="pCategory" placeholder="Category" maxlength="60" required><input id="pPrice" type="number" step="0.01" min="0.01" placeholder="Price" required><input id="pStock" type="number" min="0" placeholder="Stock" required><input id="pImage" placeholder="Image URL" maxlength="500"><textarea id="pDescription" placeholder="Description" maxlength="500"></textarea><button class="primary" type="submit">Save product</button></form></div></div><div id="toast"></div><script src="/admin.js"></script></body></html>
