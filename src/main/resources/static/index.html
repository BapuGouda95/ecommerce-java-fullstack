<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopSphere | E-Commerce</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand">ShopSphere</div><nav><a href="#home">Home</a><a href="#products">Products</a><button id="cartBtn">Cart <span id="count">0</span></button></nav></header>
<main id="home"><section class="hero"><div><p class="eyebrow">JAVA FULL-STACK STORE</p><h1>Simple shopping.<br><span>Built properly.</span></h1><p>Explore quality products powered by a Spring Boot REST API and MySQL.</p><a class="primary" href="#products">Shop now</a></div></section>
<section id="products" class="catalog"><div class="section-head"><div><p class="eyebrow">COLLECTION</p><h2>Featured products</h2></div><div class="controls"><input id="search" placeholder="Search products..."><select id="category"><option value="">All categories</option><option>Electronics</option><option>Fashion</option><option>Accessories</option></select></div></div><div id="grid" class="grid"></div></section></main>
<aside id="cart" class="drawer"><div class="drawer-head"><h2>Your cart</h2><button onclick="toggleCart()">×</button></div><div id="cartItems"></div><div class="total"><span>Total</span><strong id="total">₹0</strong></div><button class="primary checkout" onclick="checkout()">Checkout</button></aside>
<div id="toast"></div><script src="/app.js"></script></body></html>
